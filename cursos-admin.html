<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos</title>
    <!-- Comentário: 
        cursos-admin.html
        Página de administração de cursos. Contém tabela de cursos, imagens
        e ações de edição/remoção (exemplo estático). Mantida consistência com
        o layout do painel administrativo. Incluir comentários detalhados
        facilita a manutenção e integração com o backend posteriormente.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/auth-guard.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="css/cursos-admin.css">
</head>
<body class="flex">
    <aside class="sidebar">
        <!-- Comentário: Identidade visual do painel administrativo -->
        <div class="p-6 border-b flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-900 rounded-full flex items-center justify-center text-white font-bold">L</div>
            <span class="text-xl font-bold text-gray-800">Mara & Lú</span>
        </div>
        <nav class="p-4 flex-1 space-y-1">
            <!-- Comentário: Navegação entre os módulos de gestão -->
            <a href="Dashboard2.html" class="nav-item"><span class="flex items-center gap-3"><i class="fas fa-home"></i> Dashboard</span></a>
            <div>
                <button onclick="toggleMenu('m1', 'i1')" class="nav-item w-full">
                    <span class="flex items-center gap-3"><i class="fas fa-briefcase"></i> Inscrições e Matrículas</span>
                    <i id="i1" class="fas fa-chevron-down text-xs rotate-icon"></i>
                </button>
                <div id="m1" class="submenu">
                    <a href="lista-inscricoes.html" class="block py-2 text-sm hover:text-purple-600">Candidaturas Pendentes</a>
                    <a href="aprovados.html" class="block py-2 text-sm hover:text-purple-600">Aprovados</a>
                    <a href="todas-inscricoes.html" class="block py-2 text-sm hover:text-purple-600">Todas as Inscrições</a>
                </div>
            </div>
            <div>
                <button onclick="toggleMenu('m2', 'i2')" class="nav-item w-full active">
                    <span class="flex items-center gap-3"><i class="fas fa-book"></i> Gestão Acadêmica</span>
                    <i id="i2" class="fas fa-chevron-down text-xs rotate-icon active"></i>
                </button>
                <div id="m2" class="submenu open">
                    <a href="cursos-admin.html" class="block py-2 text-sm text-purple-600 font-bold">Cursos</a>
                    <a href="vagas.html" class="block py-2 text-sm hover:text-purple-600">Gestão de Vagas</a>
                </div>
            </div>
        </nav>
    </aside>

    <main class="">
        <header class="header-admin" style="background-color: #4C1D95; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
            <div class="flex items-center gap-4">
                
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center"><i class="fas fa-graduation-cap"></i></div>
                    <span class="font-bold">Mara & Lú</span>
                </div>
            </div>
            
        </header>

        <div class="container-padding" style="padding: 2rem;">
            <div class="flex items-center gap-4 mb-8">
                <h1 class="text-2xl font-bold text-gray-800">Cursos</h1>
                <nav class="text-sm text-gray-400">
                    <i class="fas fa-home"></i> Página Inicial > <span class="text-gray-600">Cursos</span>
                </nav>
            </div>

            <div class="card" style="background: white; padding: 2rem; border-radius: 0.5rem; border: 1px solid #e5e7eb; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);">
                <div class="flex flex-col md:flex-row gap-4 mb-8 items-end">
                    <div class="flex-1 max-w-md">
                        <input type="text" id="busca-cursos" onkeyup="if(event.key==='Enter') filtrarCursos()" placeholder="Buscar curso..." class="p-3 border rounded-md w-full">
                    </div>
                    <button onclick="filtrarCursos()" class="bg-yellow-500 text-white px-8 py-3 rounded-md font-bold hover:bg-yellow-600 transition">Filtrar</button>
                </div>
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold">Cursos</h2>
                    <button onclick="abrirModalCurso()" class="bg-yellow-500 text-white px-6 py-2 rounded-md font-bold hover:bg-yellow-600 transition">+ Adicionar Curso</button>
                </div>

                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Área</th>
                                <th>Sigla</th>
                                <th>Data de criação</th>
                                <th style="text-align: right;">Acções</th>
                            </tr>
                        </thead>
                        <tbody id="cursos-corpo" class="text-sm">
                            <!-- Comentário: Preenchido por JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/admin-core.js"></script>
    <script>
        /**
         * Alterna a visibilidade dos submenus na barra lateral.
         */
        function toggleMenu(id, iconId) {
            const menu = document.getElementById(id);
            const icon = document.getElementById(iconId);
            if(menu) menu.classList.toggle('open');
            if(icon) icon.classList.toggle('active');
        }

        /**
         * Carrega e renderiza os cursos na tabela.
         */
        function carregarCursos() {
            const cursos = AdminCore.getCursos();
            const busca = document.getElementById('busca-cursos').value.toLowerCase().trim();
            const corpo = document.getElementById('cursos-corpo');
            if(!corpo) return;
            corpo.innerHTML = '';

            const filtrados = cursos.filter(c => 
                busca === '' || c.nome.toLowerCase().includes(busca) || c.area.toLowerCase().includes(busca)
            );

            if (filtrados.length === 0) {
                corpo.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-400">Nenhum curso encontrado</td></tr>';
                return;
            }

            filtrados.forEach((curso, idx) => {
                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-4 font-bold">${curso.nome}</td>
                    <td class="p-4">${curso.area}</td>
                    <td class="p-4"><span style="background:#e5e7eb; padding:4px 8px; border-radius:4px;">${curso.sigla}</span></td>
                    <td class="p-4 text-gray-400">${curso.dataCriacao}</td>
                    <td class="p-4 text-right">
                        <button onclick="editarCurso(${idx})" style="background:#eab308; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:12px; font-weight:700; cursor:pointer; margin-right:4px;" onmouseover="this.style.background='#ca8a04'" onmouseout="this.style.background='#eab308'">Editar</button>
                        <button onclick="deletarCurso(${idx})" style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:12px; font-weight:700; cursor:pointer;" onmouseover="this.style.background='#dc2626'" onmouseout="this.style.background='#ef4444'">Eliminar</button>
                    </td>
                `;
                corpo.appendChild(tr);
            });
        }

        function filtrarCursos() {
            carregarCursos();
        }

        function abrirModalCurso(idx = null) {
            const curso = idx !== null ? AdminCore.getCursos()[idx] : null;
            const titulo = idx !== null ? 'Editar Curso' : 'Adicionar Novo Curso';
            
            const html = `
                <div style="position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:80;" id="modal-curso-backdrop">
                    <div style="background:white; border-radius:10px; padding:20px; width:450px; max-width:90%; box-shadow:0 10px 30px rgba(0,0,0,0.3);">
                        <h3 style="font-size:1.25rem; font-weight:700; margin-bottom:1rem;">${titulo}</h3>
                        <div style="display:flex; flex-direction:column; gap:1rem;">
                            <input type="text" id="curso-nome" placeholder="Nome do Curso" value="${curso?.nome || ''}" style="padding:10px; border:1px solid #e5e7eb; border-radius:6px;">
                            <input type="text" id="curso-area" placeholder="Área (ex: Tecnologia)" value="${curso?.area || ''}" style="padding:10px; border:1px solid #e5e7eb; border-radius:6px;">
                            <input type="text" id="curso-sigla" placeholder="Sigla (ex: INF)" value="${curso?.sigla || ''}" style="padding:10px; border:1px solid #e5e7eb; border-radius:6px; text-transform:uppercase;">
                        </div>
                        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:1.5rem;">
                            <button onclick="fecharModalCurso()" style="background:#f3f4f6; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:600;">Cancelar</button>
                            <button onclick="salvarCurso(${idx})" style="background:#4C1D95; color:white; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:600;">Salvar</button>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', html);
            document.getElementById('modal-curso-backdrop').onclick = function(e) {
                if(e.target === this) fecharModalCurso();
            };
        }

        function fecharModalCurso() {
            const modal = document.getElementById('modal-curso-backdrop');
            if(modal) modal.remove();
        }

        function salvarCurso(idx) {
            const nome = document.getElementById('curso-nome').value.trim();
            const area = document.getElementById('curso-area').value.trim();
            const sigla = document.getElementById('curso-sigla').value.trim();

            if(!nome || !area || !sigla) {
                alert('Por favor, preencha todos os campos!');
                return;
            }

            let cursos = AdminCore.getCursos();
            const curso = { nome, area, sigla, dataCriacao: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) };

            if(idx !== null) {
                cursos[idx] = { ...cursos[idx], ...curso };
            } else {
                cursos.push(curso);
            }

            AdminCore.saveCursos(cursos);
            AdminCore.addNotification(idx !== null ? 'Curso atualizado com sucesso!' : 'Novo curso adicionado!', 'success');
            fecharModalCurso();
            carregarCursos();
        }

        function editarCurso(idx) {
            abrirModalCurso(idx);
        }

        function deletarCurso(idx) {
            if(confirm('Tem certeza que deseja eliminar este curso?')) {
                let cursos = AdminCore.getCursos();
                cursos.splice(idx, 1);
                AdminCore.saveCursos(cursos);
                AdminCore.addNotification('Curso eliminado com sucesso!', 'success');
                carregarCursos();
            }
        }

        /**
         * Inicializa os 3 cursos padrão do colégio caso ainda não existam no localStorage.
         * Isso garante que a primeira visita já mostra os cursos reais da escola.
         */
        function inicializarCursosPadrao() {
            const existentes = AdminCore.getCursos();
            if (existentes.length > 0) return; // Já há cursos, não sobrescrever

            const cursosPadrao = [
                {
                    id: 'curso-001',
                    nome: 'Ciências Físicas e Biológicas',
                    area: 'Ciências Naturais',
                    sigla: 'CFB',
                    descricao: 'Curso focado em ciências exatas e biológicas, incluindo laboratório, física e biologia.',
                    dataCriacao: new Date().toLocaleDateString('pt-AO')
                },
                {
                    id: 'curso-002',
                    nome: 'Informática (Técnico)',
                    area: 'Tecnologia de Informação',
                    sigla: 'INF',
                    descricao: 'Formação técnica em informática abrangendo programação, redes, manutenção de hardware e software.',
                    dataCriacao: new Date().toLocaleDateString('pt-AO')
                },
                {
                    id: 'curso-003',
                    nome: 'Ciências Económicas-Jurídicas',
                    area: 'Ciências Sociais',
                    sigla: 'CEJ',
                    descricao: 'Curso que combina fundamentos de economia, direito e gestão para formação em áreas administrativas.',
                    dataCriacao: new Date().toLocaleDateString('pt-AO')
                }
            ];

            AdminCore.saveCursos(cursosPadrao);
            AdminCore.addNotification('Cursos padrão carregados automaticamente.', 'info');
        }

        document.addEventListener('DOMContentLoaded', function() {
            inicializarCursosPadrao();
            carregarCursos();
        });
    </script>

    <!-- Botão de configurações (roda dentada) -->
    <button id="settings-btn" onclick="openSettingsModal()" class="fixed right-0 top-1/2 -translate-y-1/2 bg-gray-800 text-white p-3 rounded-l-md shadow-lg" style="z-index:65;">
        <i class="fas fa-cog gear-spin"></i>
    </button>

    <!-- Modal de Configurações Estilizado -->
    <div id="modal-config" style="display:none;position:fixed;inset:0;background:rgba(10,5,30,0.55);backdrop-filter:blur(3px);align-items:center;justify-content:center;z-index:70;" onclick="if(event.target===this) closeSettingsModal()">
        <div style="background:#fff;border-radius:16px;padding:28px;width:360px;max-width:92%;box-shadow:0 24px 60px rgba(10,5,40,0.28);animation:modalSlideIn 0.22s cubic-bezier(.16,1,.3,1);">

            <!-- Cabeçalho -->
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #f0eeff;">
                <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#4C1D95,#7c3aed);display:flex;align-items:center;justify-content:center;">
                        <i class="fas fa-cog" style="color:white;font-size:15px;"></i>
                    </div>
                    <div>
                        <h4 style="margin:0;font-size:1.05rem;font-weight:700;color:#1e0a4a;">Configurações</h4>
                        <p style="margin:0;font-size:0.78rem;color:#9ca3af;">Área administrativa</p>
                    </div>
                </div>
                <button onclick="closeSettingsModal()" style="background:#f3f4f6;border:none;cursor:pointer;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:16px;">&times;</button>
            </div>
            <!-- Acções -->
            <div style="display:flex;flex-direction:column;gap:10px;">
                <button onclick="window.location.href='index.html'" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1.5px solid #e5e7eb;background:#fff;cursor:pointer;font-size:0.92rem;font-weight:600;color:#1e0a4a;text-align:left;width:100%;transition:all 0.15s;" onmouseover="this.style.background='#f5f0ff';this.style.borderColor='#4C1D95'" onmouseout="this.style.background='#fff';this.style.borderColor='#e5e7eb'">
                    <span style="width:34px;height:34px;border-radius:8px;background:#ede9fe;color:#4C1D95;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;"><i class="fas fa-globe"></i></span>
                    <span><strong>Ver site público</strong><div style="font-size:0.75rem;color:#6b7280;font-weight:400;">Abrir a página principal do colégio</div></span>
                </button>
                <button onclick="logout()" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1.5px solid #fca5a5;background:#fff;cursor:pointer;font-size:0.92rem;font-weight:600;color:#dc2626;text-align:left;width:100%;transition:all 0.15s;" onmouseover="this.style.background='#fff1f1'" onmouseout="this.style.background='#fff'">
                    <span style="width:34px;height:34px;border-radius:8px;background:#fee2e2;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;"><i class="fas fa-sign-out-alt"></i></span>
                    <span><strong>Terminar sessão</strong><div style="font-size:0.75rem;color:#f87171;font-weight:400;">Sair da área administrativa</div></span>
                </button>
            </div>
            <div style="margin-top:20px;padding-top:12px;border-top:1px solid #f0eeff;text-align:center;">
                <span style="font-size:0.72rem;color:#c4b5fd;">Colégio Mara &amp; Lú &bull; Painel Administrativo v1.0</span>
            </div>
        </div>
    </div>

    <script>
        function openSettingsModal(){ const m=document.getElementById('modal-config'); if(m) m.style.display='flex'; }
        function closeSettingsModal(){ const m=document.getElementById('modal-config'); if(m) m.style.display='none'; }
    </script>
    <!-- Comentário: Fim do corpo da página -->
</body>
</html>
